<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_pinecrest.css">
<style>
  body { width:1200px; height:1600px; background:var(--mint); padding:110px; display:flex; flex-direction:column; justify-content:space-between; position:relative; overflow:hidden; }
  .circle { position:absolute; width:900px; height:900px; border-radius:50%; background:#c8ece5; right:-300px; top:300px; }

  .logo { font-size:34px; position:relative; } .logo i { width:46px; height:46px; border-radius:13px; }
</style></head><body><div class="circle"></div>
  <h1>Smile,<br><span>you're early.</span></h1>
  <p>Grab a glass of water and make yourself comfortable. Free Wi-Fi: <b>Pinecrest-Guest</b></p>
